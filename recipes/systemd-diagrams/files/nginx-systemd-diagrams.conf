# Include from a server{} block if the diagrams are not already under the
# site root, e.g.:
#   include snippets/systemd-diagrams.conf;
#
# When nginx_docroot is /var/www/html/systemd, the default Debian site already
# serves these files at /systemd/ without this snippet.
location /systemd/ {
    alias /var/www/html/systemd/;
    default_type text/html;
    types {
        text/html html htm;
        image/svg+xml svg;
        text/plain dot txt;
    }
}
